plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

base {
    archivesName = "${mod_name}-forge-${minecraft_version}"
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

def rawRuntimeMods = files(
    fileTree(dir: rootProject.file('run/mods'), include: ['*.jar']),
    fileTree(dir: file('run/mods'), include: ['*.jar'])
)
def remappedRuntimeModsDir = layout.buildDirectory.dir('remappedRunMods')
def runClientModsDir = layout.projectDirectory.dir('run/client/mods')

def cleanRemappedRuntimeMods = tasks.register('cleanRemappedRuntimeMods', Delete) {
    delete(remappedRuntimeModsDir)
    delete(runClientModsDir)
}

def remapRuntimeModTasks = rawRuntimeMods.files.collect { modJar ->
    def safeName = modJar.name.replaceAll(/[^A-Za-z0-9]/, '_')
    tasks.register("remapRunMod_${safeName}", net.neoforged.moddevgradle.legacyforge.tasks.RemapJar) {
        dependsOn(cleanRemappedRuntimeMods)
        archiveFileName.set(modJar.name)
        destinationDirectory.set(remappedRuntimeModsDir)
        input.set(modJar)
        libraries.from(configurations.remappingDependencies)
        obfuscation.configureSrgToNamedOperation(remapOperation)
    }
}

def prepareRemappedRuntimeMods = tasks.register('prepareRemappedRuntimeMods', Sync) {
    dependsOn(cleanRemappedRuntimeMods)
    dependsOn(remapRuntimeModTasks)
    from(remappedRuntimeModsDir)
    into(runClientModsDir)
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        client {
            client()
            gameDirectory.set(file('run/client'))
            taskBefore(prepareRemappedRuntimeMods)
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
    compileOnly "org.jetbrains:annotations:24.1.0"
}

jar {
    finalizedBy('reobfJar')
    manifest {
        attributes["MixinConfigs"] = "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
